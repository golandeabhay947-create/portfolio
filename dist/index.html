    <!-- Anti-flash: apply theme before React paints -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('ag-theme');
          var theme = stored
            ? stored
            : window.matchMedia('(prefers-color-scheme: light)').matches
            ? 'light'
            : 'dark';
          if (theme === 'light') document.documentElement.classList.add('light');
        } catch (e) {}
      })();
    </script>
